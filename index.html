<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시민과 함께, 수원도시공사 사업장 안내</title>
<meta name="description" content="가까운 수원도시공사 시설의 위치와 하는 일을 한 장의 지도로 안내합니다. 베타 버전.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#E6EDEF; --ink:#1E2B35; --muted:#5B6B76; --line:#D3DCE0; --surface:#FFFFFF; --soft:#F3F6F7;
  --focus:#1D5FD1; --warn-bg:#FFF4D6; --warn-ink:#6B4A00;
  --sheet-peek:148px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* top bar */
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;pointer-events:none}
.brand{display:flex;align-items:baseline;gap:10px;pointer-events:auto}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}
.logo{display:block;height:24px;width:auto;pointer-events:auto}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid var(--line);pointer-events:auto;flex:0 0 auto}
.lang button{border:0;background:none;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.brand h1{margin:0;font-size:18px;line-height:1.3;font-weight:700;letter-spacing:-0.02em;text-wrap:balance}
.top .sub{margin:3px 0 0;font-size:13px;color:var(--muted);pointer-events:auto}
.beta{font-size:12px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:3px 9px;transform:translateY(-2px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;
  scrollbar-width:none;pointer-events:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 11px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.94);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip[aria-pressed="true"] .sw{outline:2px solid #fff}

/* map */
#map{position:fixed;inset:0;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
#map svg{width:100%;height:100%;display:block}
.zoom{position:fixed;right:14px;z-index:15;display:flex;flex-direction:column;gap:6px;
  bottom:calc(var(--sheet-peek) + 16px)}
.zoom button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:600;cursor:pointer;
  box-shadow:0 2px 8px rgba(30,43,53,.08)}
.zoom button.fit{font-size:13px}
.compass{position:fixed;right:14px;z-index:15;top:calc(env(safe-area-inset-top) + 156px);width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.9);
  border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}

.mk{cursor:pointer}
.mk:focus{outline:none}
.mk:focus-visible .ring{stroke:var(--focus);stroke-width:3}
.mk .ring{fill:none;stroke:transparent}
.mk.sel .ring{stroke:var(--ink);stroke-width:2.5}
.lbl rect{fill:#fff;stroke:rgba(30,43,53,.18)}
.lbl text{font-size:12.5px;font-weight:700;fill:var(--ink)}
.lblx.sel rect{fill:var(--ink);stroke:var(--ink)}
.lblx.sel text{fill:#fff}
.hide{display:none}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-radius:18px 18px 0 0;
  box-shadow:0 -8px 28px rgba(30,43,53,.14);height:88vh;height:88dvh;display:flex;flex-direction:column;
  transform:translateY(calc(100% - var(--sheet-peek)));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.half{transform:translateY(52%)}
#sheet.full{transform:translateY(0)}
#sheet.dragging{transition:none}
.grab{flex:0 0 auto;padding:10px 16px 4px;cursor:grab;touch-action:none;border:0;background:none;width:100%;text-align:left}
.grab .bar{display:block;width:40px;height:5px;border-radius:3px;background:#C9D3D8;margin:0 auto 10px}
.grab .sum{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.grab strong{font-size:17px;font-weight:700;letter-spacing:-0.01em}
.grab span.cnt{font-size:13px;color:var(--muted)}
.search{flex:0 0 auto;padding:6px 16px 10px}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 14px;font:inherit;font-size:15px;color:var(--ink)}
.body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:0 0 calc(env(safe-area-inset-bottom) + 24px)}
.list{list-style:none;margin:0;padding:0 8px}
.list li button{width:100%;display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;background:none;
  padding:12px 8px;border-radius:12px;cursor:pointer}
.list li button:hover{background:var(--soft)}
.list .bar6{width:6px;height:38px;border-radius:3px}
.list .nm{display:block;font-size:15.5px;font-weight:700;line-height:1.3}
.list .meta{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.list .side{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.list .flag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--warn-ink);background:var(--warn-bg);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.grouph{font-size:13px;font-weight:700;color:var(--muted);padding:14px 16px 4px}
.empty{padding:20px 16px;color:var(--muted);font-size:14.5px}
.about{margin:4px 16px 8px;padding:14px 16px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.6}
.about h2{margin:0 0 6px;font-size:16px;line-height:1.35}
.about p{margin:0 0 6px}
.about p:last-child{margin:0}
.foot{padding:18px 16px 8px;font-size:12.5px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);margin:14px 16px 0}
.foot p{margin:0 0 6px}

.detail{padding:0 16px}
.back{border:0;background:none;padding:6px 0;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff;margin-top:6px}
.detail h2{margin:10px 0 4px;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-0.02em}
.detail .sub{font-size:14px;color:var(--muted)}
.detail .what{font-size:16px;line-height:1.6;margin:14px 0 4px}
.note{font-size:13.5px;line-height:1.5;background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;margin:12px 0 4px}
.note.info{background:var(--soft);color:var(--muted)}
.info{margin:12px 0 0;padding:0}
.info div{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
.info dt{color:var(--muted);font-weight:600}
.info dd{margin:0;word-break:keep-all;overflow-wrap:anywhere}
.info dd.none{color:var(--muted)}
.info a{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 8px}
.acts a{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid var(--line);background:#fff}
.acts a.primary{grid-column:1 / -1;background:var(--ink);color:#fff;border-color:var(--ink)}

/* desktop */
@media (max-width:899px){
  .compass{display:none}
  .top{padding-top:calc(env(safe-area-inset-top) + 8px)}
  .toprow{margin-bottom:6px}
  .logo{height:20px}
  .lang button{height:28px;padding:0 10px;font-size:12.5px}
  .brand{gap:8px}
  .brand h1{font-size:16px;line-height:1.3}
  .beta{font-size:11px;padding:2px 7px;transform:none}
  .top .sub{display:none}
  .chips{padding:8px 16px 6px;gap:6px}
  .chip{height:34px;font-size:13.5px;padding:0 12px 0 10px}
  .search input{font-size:16px}
  .zoom #zin,.zoom #zout{display:none}
  .zoom{right:12px;bottom:calc(var(--sheet-peek) + 12px)}
  .zoom button.fit{width:auto;height:34px;padding:0 14px;border-radius:999px;font-size:13px;box-shadow:0 2px 10px rgba(30,43,53,.16)}
  body:not(.zoomed) .zoom{display:none}
}
@media (min-width:900px){
  :root{--sheet-peek:0px}
  .top{left:400px;padding:18px 24px 0}
  .logo{height:28px}
  .toprow{max-width:720px}
  .brand h1{font-size:22px}
  .top .sub{font-size:14px}
  .chips{margin:0;padding:14px 0 0;flex-wrap:wrap;overflow:visible}
  #sheet,#sheet.half,#sheet.full{left:0;top:0;right:auto;width:400px;height:100%;border-radius:0;transform:none;box-shadow:8px 0 28px rgba(30,43,53,.08)}
  .grab{cursor:default;padding-top:22px}
  .grab .bar{display:none}
  #map{left:400px}
  .zoom{bottom:24px;right:24px}
  .compass{right:24px;top:auto;bottom:178px}
}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>

grab.addEventListener("pointermove",e=>{if(sy===null)return;const dy=e.clientY-sy;sMoved=Math.abs(dy);const top=Math.max(innerHeight*.12,sStart+dy);
  sheet.style.transform=`translateY(${top-(innerHeight-sheet.offsetHeight)}px)`});
grab.addEventListener("pointerup",e=>{if(sy===null)return;sheet.classList.remove("dragging");sheet.style.transform="";
  const top=sheet.getBoundingClientRect().top, cur=sheet.dataset.s||"peek";
  if(sMoved<6){setSheet(cur==="peek"?"half":cur==="half"?"full":"peek")}
  else{const r=top/innerHeight;setSheet(r<.3?"full":r<.72?"half":"peek")}
  sy=null});
mapEl.addEventListener("pointerdown",()=>{if(innerWidth<900&&sheet.dataset.s==="full")setSheet("half")});

/* ---------- language switch ---------- */
function applyStatic(){
  document.documentElement.lang=lang;
  document.title=L("시민과 함께, 수원도시공사 사업장 안내","Suwon Urban Development Corporation: Places Map");
  $("#ttl").textContent=L("시민과 함께, 수원도시공사 사업장 안내",narrow()?"Places run by SUDC":"Places run by Suwon Urban Development Corporation");
  $("#betaTag").textContent=L("베타","Beta");
  $("#subt").textContent=L("가까운 공사 시설의 위치와 하는 일을 확인하세요.","Find SUDC facilities near you and see what each one offers.");
  $("#q").placeholder=L("시설 이름으로 찾기 (예: 수영장, 캠핑)","Search by name (e.g. swimming, camping)");
  $("#q").setAttribute("aria-label",L("시설 이름으로 찾기","Search places by name"));
  $("#zin").setAttribute("aria-label",L("지도 확대","Zoom in"));$("#zout").setAttribute("aria-label",L("지도 축소","Zoom out"));
  $("#zfit").setAttribute("aria-label",L("수원 전체 보기","Show all of Suwon"));$("#zfit").textContent=L("전체","All");
  $("#grab").setAttribute("aria-label",L("목록 패널 펼치기 또는 접기","Expand or collapse the list"));
  sheet.setAttribute("aria-label",L("사업장 목록과 상세 정보","List of places and details"));
  mapEl.setAttribute("aria-label",L("수원도시공사 사업장 일러스트 지도. 같은 내용을 목록에서도 볼 수 있습니다.","Illustrated map of SUDC places. The same places are listed in the panel."));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
}
function setLang(l){
  if(l===lang)return; lang=l;
  try{localStorage.setItem("sudc-map-lang",l)}catch(e){}
  try{history.replaceState(null,"",l==="en"?"#en":location.pathname+location.search)}catch(e){}
  applyStatic(); chips(); relabel(); refresh();
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
addEventListener("hashchange",()=>{if(location.hash==="#en")setLang("en")});
/* ---------- start ---------- */
applyStatic(); chips(); draw(); relabel(); setSheet("peek"); refresh(); requestAnimationFrame(()=>fit(false));
try{document.fonts&&document.fonts.ready.then(()=>{relabel();apply()})}catch(e){}
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{applyStatic();relabel();fit(false)},150)});
</script>
</body>
